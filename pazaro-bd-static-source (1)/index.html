    <style>
      /* Critical above-the-fold CSS for instant first paint */
      :root {
        --primary: #0f766e;
        --primary-dark: #0a5852;
        --accent: #ff6b57;
        --accent-hover: #f25540;
        --amber: #fbbf24;
        --bg: #faf8f5;
        --surface: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --footer-bg: #083d38;
        --border: rgba(31, 41, 55, 0.08);
        --radius: 14px;
        --shadow: 0 4px 18px rgba(15, 118, 110, 0.06);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        font-family: 'Poppins', 'Hind Siliguri', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        line-height: 1.55;
        overflow-x: hidden;
      }
      .boot-skeleton {
        max-width: 1280px;
        margin: 0 auto;
        padding: 16px;
      }
      .skel-bar {
        height: 56px;
        border-radius: 14px;
        background: linear-gradient(90deg, #ede9e2 25%, #f5f2ec 50%, #ede9e2 75%);
        background-size: 200% 100%;
        animation: skelShimmer 1.3s infinite linear;
      }
      .skel-hero {
        margin-top: 16px;
        height: 320px;
        border-radius: 14px;
        background: linear-gradient(90deg, #ede9e2 25%, #f5f2ec 50%, #ede9e2 75%);
        background-size: 200% 100%;
        animation: skelShimmer 1.3s infinite linear;
      }
      @keyframes skelShimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
    </style>
    <link rel="stylesheet" href="./styles.css" />
  <script src="/_aistudio-iframe.js?v=29045eb3"></script></head>
  <body>
    <div id="app">

        <div class="skel-hero"></div>
